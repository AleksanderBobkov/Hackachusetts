<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hear &amp; Read</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Hear &amp; Read</h1>
        <p id="connection" aria-live="polite">Checking microphone…</p>
      </header>

      <section class="intro" id="intro">
        <h2>Speak naturally. Read it in your language.</h2>
        <p>Choose the language you would like to see.</p>
      </section>

      <section class="language-picker" aria-label="Output language">
        <label for="targetLanguage">Show me</label>
        <select id="targetLanguage">
          <option>English</option>
          <option>Spanish</option>
          <option>French</option>
          <option>Portuguese</option>
          <option>Mandarin Chinese</option>
          <option>Hindi</option>
          <option>Arabic</option>
          <option>Korean</option>
          <option>Vietnamese</option>
          <option>Tagalog</option>
        </select>
      </section>

      <button id="recordButton" class="record" type="button" aria-pressed="false">
        <span class="button-icon" aria-hidden="true">●</span>
        <span id="buttonText">Tap to speak</span>
      </button>
      <p id="recordingHint" class="hint" aria-live="polite"></p>

      <section id="results" class="results" hidden aria-live="polite">
        <article>
          <p class="label" id="originalLanguage">YOU SAID</p>
          <p id="originalText" class="spoken-text"></p>
          <p id="originalPronunciation" class="pronunciation" hidden></p>
        </article>
        <article id="translationCard">
          <p class="label" id="translatedLanguage">TRANSLATION</p>
          <p id="translatedText" class="spoken-text translation"></p>
          <p id="translationPronunciation" class="pronunciation" hidden></p>
        </article>
        <p id="resultNote" class="mock-note"></p>
      </section>

      <button id="speakButton" class="secondary speak" type="button" hidden>🔊 Speak aloud</button>
      <p id="voiceDisclosure" class="voice-disclosure" hidden>Audio is generated by an AI voice.</p>
      <button id="clearButton" class="secondary" type="button" hidden>Clear screen</button>
    </main>
    <script src="/app.js?v=7"></script>
  </body>
</html>
